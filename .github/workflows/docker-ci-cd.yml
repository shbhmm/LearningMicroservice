name: Docker CI/CD

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build CourseService
        run: dotnet build ./src/CourseService/CourseService.sln --configuration Release

      - name: Build StudentService
        run: dotnet build ./src/StudentService/StudentService.sln --configuration Release

      - name: Build EnrollmentService
        run: dotnet build ./src/EnrollmentService/EnrollmentService.sln --configuration Release

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Images
        run: docker compose build

      - name: Push Docker Images
        run: docker compose push